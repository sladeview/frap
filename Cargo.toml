[package]
name = "frap"
version = "0.1.0"
edition = "2024"
description = "A pure Rust port of the Finnish/Fabulous APRS Parser"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
repository = "https://github.com/sladeview/frap"
keywords = ["aprs", "ax25", "packet-radio", "parser"]
categories = ["parser-implementations"]
exclude = ["/.github", "/test-data/*.tnc2", "/test-data/*.json"]
publish = ["crates-io"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
# All parser tests are black-box integration tests in tests/parser.rs. Avoid
# building an additional empty libtest harness.
test = false

[features]
default = []
aprs-is = ["dep:tokio"]

[dependencies]
tokio = { version = "1.53.1", optional = true, features = ["io-util", "macros", "net", "rt", "time"] }

[[test]]
name = "aprsis"
path = "tests/aprsis.rs"
required-features = ["aprs-is"]

[[bench]]
name = "parser"
harness = false

[[example]]
name = "dataset-bench"
path = "examples/dataset-bench.rs"

[[example]]
name = "dataset-capture"
path = "examples/dataset-capture.rs"
required-features = ["aprs-is"]
